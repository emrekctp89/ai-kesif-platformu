name: Kasif live eval

# Optional live catalog regression. Requires secrets:
#   KASIF_EVAL_URL — base URL of a running deployment (e.g. https://…vercel.app)
# Skips cleanly when secret is missing.

on:
  workflow_dispatch:
  schedule:
    # Daily 06:15 UTC
    - cron: '15 6 * * *'

jobs:
  live-eval:
    name: Live evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check KASIF_EVAL_URL
        id: check
        run: |
          if [ -z "${{ secrets.KASIF_EVAL_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "KASIF_EVAL_URL secret not set — skipping live eval."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live Kâşif evaluation
        if: steps.check.outputs.skip != 'true'
        env:
          KASIF_EVAL_URL: ${{ secrets.KASIF_EVAL_URL }}
          KASIF_EVAL_MAX_LATENCY_MS: ${{ secrets.KASIF_EVAL_MAX_LATENCY_MS || '8000' }}
        run: npm run kasif:evaluate
